# Produksi: gabungkan dengan berkas dasar.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Prasyarat: .env berisi rahasia produksi (JWT_SECRET, LLM_ENCRYPTION_KEY, sandi DB/MinIO), APP_BASE_URL https,
# MINIO_PUBLIC_ENDPOINT=<domain>, MINIO_PUBLIC_SECURE=true, dan sertifikat di nginx/tls/.
# Memerlukan Docker Compose >= 2.24 (tag !override / !reset).

x-produksi: &produksi
  environment:
    APP_ENV: production
    COOKIE_SECURE: "true"
  restart: always

services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./nginx/prod/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    restart: always

  api:
    <<: *produksi
  worker:
    <<: *produksi
    command: celery -A app.worker.celery_app worker -l info -Q default,dokumen,llm,periodik --concurrency=4
  beat:
    <<: *produksi

  # Basis data & penyimpanan tidak dibuka ke luar host.
  postgres:
    ports: !reset []
    restart: always
  redis:
    restart: always
  minio:
    restart: always

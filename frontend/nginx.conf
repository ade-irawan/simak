server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Berkas hasil build memakai hash di nama → cache panjang. index.html selalu diperiksa ulang.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

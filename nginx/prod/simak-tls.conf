# Konfigurasi Nginx produksi (TLS). Dipasang oleh docker-compose.prod.yml menggantikan nginx/conf.d.
# Letakkan sertifikat di nginx/tls/fullchain.pem dan nginx/tls/privkey.pem (tidak ikut git).

upstream simak_api      { server api:8000; }
upstream simak_frontend { server frontend:80; }
upstream simak_minio    { server minio:9000; }

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://simak_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # URL unggah/unduh bertanda tangan ke MinIO; Host harus sama dengan yang ditandatangani (MINIO_PUBLIC_ENDPOINT).
    location /simak-bukti/ {
        proxy_pass http://simak_minio;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://simak_frontend;
        proxy_set_header Host $host;
    }
}
